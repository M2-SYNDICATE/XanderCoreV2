commands:
  # Команда с аргументами из списка
  - template: "открыть {app}"
    action: ""
    arguments:
      app:
        - браузер->firefox
        - телеграм->telegram-desktop
        - дискорд->discord
        - терминал->kitty
        - ютуб->firefox --new-window 'https://www.youtube.com/'
        - блокнот->kitty -e micro

  - template: "поставь напоминалку на {time}"
    action: $notification

  # Команда с аргументом из текста
  - template: "найди в интернете {query}"
    action: search_internet

  # Команда без аргументов
  - template: "включи музыку"
    action: firefox

  - template: "смени обои"
    action: ~/randwp/randwp

  - template: "адаптируй цвета"
    action: Scripts/test.sh

  - template: "спящий режим"
    action: systemctl suspend

  - template: "ничего"
    action: $stop

  - template: "отдыхай"
    action: $stop

  - template: "спасибо"
    action: $stop

  - template: "ещё"
    action: retry

  - template: "снова"
    action: retry

  - template: "дальше"
    action: retry

  - template: "напиши {query}"
    action: Scripts/llm
